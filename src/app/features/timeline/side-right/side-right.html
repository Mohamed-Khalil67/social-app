<div class="rounded-2xl border border-neutral-200 bg-white p-4 shadow-sm">
  <div class="mb-3 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users text-brand" aria-hidden="true">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <path d="M16 3.128a4 4 0 0 1 0 7.744"></path>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
        <circle cx="9" cy="7" r="4"></circle>
      </svg>
      <h3 class="text-base font-extrabold text-neutral-900">Suggested Friends</h3>
    </div>
    <span class="rounded-full bg-neutral-100 px-2 py-0.5 text-xs font-bold text-neutral-600">5</span>
  </div>

  <div class="mb-3">
    <label class="relative block">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400" aria-hidden="true">
        <path d="m21 21-4.34-4.34"></path>
        <circle cx="11" cy="11" r="8"></circle>
      </svg>
      <input
        type="text"
        placeholder="Search friends..."
        class="w-full rounded-xl border border-neutral-200 bg-neutral-50 py-2 pl-9 pr-3 text-sm text-neutral-700 outline-none focus:border-brand focus:bg-white transition-colors"
        value=""
      />
    </label>
  </div>

  <div class="space-y-3">
    @for (user of suggestedUsers(); track user._id){
      <div class="rounded-xl border border-neutral-200 p-2.5">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <img
              [alt]="user.name"
              class="h-10 w-10 rounded-full object-cover"
              [src]="user.photo || 'https://pub-3cba56bacf9f4965bbb0989e07dada12.r2.dev/linkedPosts/default-profile.png'"
            />
            <div class="min-w-0">
              <p class="truncate text-sm font-bold text-neutral-900">{{ user.name }}</p>
              <p class="truncate text-xs text-neutral-500">&#64;{{ user.username }}</p>
            </div>
          </div>

          <button
            type="button"
            (click)="onFollow(user)"
            class="inline-flex cursor-pointer items-center gap-1 rounded-full px-3 py-1.5 text-xs font-bold transition"
            [class]="user.isFollowing
                ? 'bg-neutral-100 text-neutral-700 hover:bg-neutral-200'
                : 'bg-brand-soft text-brand hover:bg-brand-line'"
          >
            {{ user.isFollowing ? 'Following' : '+ Follow' }}
          </button>
        </div>

        <div class="mt-2 flex items-center gap-2 text-[11px] font-semibold text-neutral-500">
          <span class="rounded-full bg-neutral-100 px-2 py-0.5">{{ user.followersCount }} followers</span>
        </div>
      </div>
    } @empty {
      <p class="text-xs text-neutral-400 text-center py-3">No suggestions found.</p>
    }
  </div>

  <button
    type="button"
    routerLink="/suggestions"
    class="mt-3 inline-flex w-full cursor-pointer items-center justify-center gap-2 rounded-xl border border-neutral-200 bg-neutral-50 px-3 py-2 text-sm font-bold text-neutral-700 transition hover:bg-neutral-100"
  >
    View more
  </button>
</div>
